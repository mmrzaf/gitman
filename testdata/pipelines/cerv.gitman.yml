image: docker:29-cli
docker: true

requires:
  - debian:trixie

env:
  DOCKER_BUILDKIT: "1"
  DEBIAN_MIRROR: http://linux-mirror.liara.ir/repository/debian
  DEBIAN_SECURITY_MIRROR: http://linux-mirror.liara.ir/repository/debian-security

steps:
  - name: verify version tag
    when: tag
    run: |
      RAW_VERSION="${GITMAN_REF#v}"
      BASE_VERSION="$(cat VERSION)"
      case "$RAW_VERSION" in
        "$BASE_VERSION"|"$BASE_VERSION"-*) ;;
        *)
          echo "release tag '$GITMAN_REF' does not match VERSION '$BASE_VERSION'" >&2
          exit 1
          ;;
      esac

  - name: build image
    when: tag
    run: |
      docker build \
        --pull=false \
        --build-arg BASE_IMAGE=debian:trixie \
        --build-arg DEBIAN_MIRROR="$DEBIAN_MIRROR" \
        --build-arg DEBIAN_SECURITY_MIRROR="$DEBIAN_SECURITY_MIRROR" \
        --label "org.opencontainers.image.revision=$GITMAN_COMMIT" \
        --label "org.opencontainers.image.ref.name=$GITMAN_REF" \
        --label "org.opencontainers.image.version=$GITMAN_VERSION" \
        --tag "cerv:$GITMAN_VERSION" \
        .

  - name: verify built image
    when: tag
    run: |
      EXPECTED_VERSION="$(cat VERSION)"
      docker image inspect "cerv:$GITMAN_VERSION" >/dev/null
      docker run --rm "cerv:$GITMAN_VERSION" --version | grep -qx "cerv $EXPECTED_VERSION"
