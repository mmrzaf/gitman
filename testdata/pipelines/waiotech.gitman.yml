# waiotech on Gitman. develop ships to staging and a v* tag to
# production: each builds the server, dashboard, admin, website and
# deployer images as waiotech-*:<version> and deploys them with the
# deployer. Other refs run nothing.
#
# Ref rules: develop and v* tags need run, docker and ship.
image: docker:29-cli
docker: true
requires:
  - python:3.13-slim-bookworm
  - node:22-bookworm-slim
  - cerv:1.0

env:
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: plain

  PYTHON_IMAGE: python:3.13-slim-bookworm
  NODE_IMAGE: node:22-bookworm-slim
  CERV_IMAGE: cerv:1.0
  DOCKER_CLI_IMAGE: docker:29-cli

  DEBIAN_MIRROR: http://linux-mirror.liara.ir/repository/debian
  DEBIAN_SECURITY_MIRROR: http://linux-mirror.liara.ir/repository/debian-security
  PIP_INDEX_URL: https://package-mirror.liara.ir/repository/pypi/simple/
  NPM_REGISTRY: https://mirror.abrha.net/repository/npm/

  VITE_API_BASE_URL: /
  VITE_API_TIMEOUT: "30000"

  PUBLIC_CONTACT_EMAIL: ""
  PUBLIC_CONTACT_PHONE: ""
  PUBLIC_CONTACT_ADDRESS_EN: ""
  PUBLIC_CONTACT_ADDRESS_FA: ""
  PUBLIC_CONTACT_MAP_URL: ""
  PUBLIC_CONTACT_FORM_ACTION: ""
  PUBLIC_CONTACT_FORM_METHOD: "post"
  PUBLIC_STATUS_URL: ""
  PUBLIC_ANDROID_URL: ""

targets:
  staging:
    branch: develop
    env:
      DEPLOY_DIR: /srv/apps/waiotech-stage
      PUBLIC_SITE_URL: https://stage.waiotech.com
      PUBLIC_DASHBOARD_URL: https://platform.stage.waiotech.com
      PUBLIC_ALLOW_INDEXING: "false"
  production:
    tag: "v*"
    env:
      DEPLOY_DIR: /srv/apps/waiotech
      PUBLIC_SITE_URL: https://waiotech.com
      PUBLIC_DASHBOARD_URL: https://platform.waiotech.com
      PUBLIC_ALLOW_INDEXING: "true"

steps:
  - name: build server
    when: target
    run: |
      set -eu
      docker build --pull=false \
        --build-arg PYTHON_IMAGE="$PYTHON_IMAGE" \
        --build-arg DEBIAN_MIRROR="$DEBIAN_MIRROR" \
        --build-arg DEBIAN_SECURITY_MIRROR="$DEBIAN_SECURITY_MIRROR" \
        --build-arg PIP_INDEX_URL="$PIP_INDEX_URL" \
        --label "org.opencontainers.image.revision=$GITMAN_COMMIT" \
        --label "org.opencontainers.image.ref.name=$GITMAN_REF" \
        --label "org.opencontainers.image.version=$GITMAN_VERSION" \
        --tag "waiotech-server:$GITMAN_VERSION" \
        -f server/Dockerfile \
        server

  - name: build dashboard
    when: target
    run: |
      set -eu
      docker build --pull=false \
        --build-arg NODE_IMAGE="$NODE_IMAGE" \
        --build-arg CERV_IMAGE="$CERV_IMAGE" \
        --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
        --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
        --build-arg VITE_API_TIMEOUT="$VITE_API_TIMEOUT" \
        --build-arg VITE_APP_VERSION="$GITMAN_VERSION" \
        --label "org.opencontainers.image.revision=$GITMAN_COMMIT" \
        --label "org.opencontainers.image.ref.name=$GITMAN_REF" \
        --label "org.opencontainers.image.version=$GITMAN_VERSION" \
        --tag "waiotech-dashboard:$GITMAN_VERSION" \
        -f dashboard/Dockerfile \
        dashboard

  - name: build admin
    when: target
    run: |
      set -eu
      docker build --pull=false \
        --build-arg NODE_IMAGE="$NODE_IMAGE" \
        --build-arg CERV_IMAGE="$CERV_IMAGE" \
        --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
        --label "org.opencontainers.image.revision=$GITMAN_COMMIT" \
        --label "org.opencontainers.image.ref.name=$GITMAN_REF" \
        --label "org.opencontainers.image.version=$GITMAN_VERSION" \
        --tag "waiotech-admin:$GITMAN_VERSION" \
        -f admin/Dockerfile \
        admin

  - name: build website
    when: target
    run: |
      set -eu
      docker build --pull=false \
        --build-arg NODE_IMAGE="$NODE_IMAGE" \
        --build-arg CERV_IMAGE="$CERV_IMAGE" \
        --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
        --build-arg PUBLIC_SITE_URL="$PUBLIC_SITE_URL" \
        --build-arg PUBLIC_DASHBOARD_URL="$PUBLIC_DASHBOARD_URL" \
        --build-arg PUBLIC_CONTACT_EMAIL="$PUBLIC_CONTACT_EMAIL" \
        --build-arg PUBLIC_CONTACT_PHONE="$PUBLIC_CONTACT_PHONE" \
        --build-arg PUBLIC_CONTACT_ADDRESS_EN="$PUBLIC_CONTACT_ADDRESS_EN" \
        --build-arg PUBLIC_CONTACT_ADDRESS_FA="$PUBLIC_CONTACT_ADDRESS_FA" \
        --build-arg PUBLIC_CONTACT_MAP_URL="$PUBLIC_CONTACT_MAP_URL" \
        --build-arg PUBLIC_CONTACT_FORM_ACTION="$PUBLIC_CONTACT_FORM_ACTION" \
        --build-arg PUBLIC_CONTACT_FORM_METHOD="$PUBLIC_CONTACT_FORM_METHOD" \
        --build-arg PUBLIC_STATUS_URL="$PUBLIC_STATUS_URL" \
        --build-arg PUBLIC_ANDROID_URL="$PUBLIC_ANDROID_URL" \
        --build-arg PUBLIC_ALLOW_INDEXING="$PUBLIC_ALLOW_INDEXING" \
        --label "org.opencontainers.image.revision=$GITMAN_COMMIT" \
        --label "org.opencontainers.image.ref.name=$GITMAN_REF" \
        --label "org.opencontainers.image.version=$GITMAN_VERSION" \
        --tag "waiotech-website:$GITMAN_VERSION" \
        -f website/Dockerfile \
        website

  - name: build deployer
    when: target
    run: |
      set -eu
      docker build --pull=false \
        --build-arg DOCKER_CLI_IMAGE="$DOCKER_CLI_IMAGE" \
        --build-arg PYTHON_IMAGE="$PYTHON_IMAGE" \
        --build-arg DEBIAN_MIRROR="$DEBIAN_MIRROR" \
        --build-arg DEBIAN_SECURITY_MIRROR="$DEBIAN_SECURITY_MIRROR" \
        --label "org.opencontainers.image.revision=$GITMAN_COMMIT" \
        --label "org.opencontainers.image.ref.name=$GITMAN_REF" \
        --label "org.opencontainers.image.version=$GITMAN_VERSION" \
        --tag "waiotech-deployer:$GITMAN_VERSION" \
        -f deploy/Dockerfile.deployer \
        deploy

  - name: deploy
    when: target
    run: |
      set -eu
      echo "Deploying $GITMAN_VERSION to $GITMAN_TARGET at $DEPLOY_DIR"
      docker run --rm --pull never \
        --network host \
        --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
        --mount type=bind,src=/srv,dst=/srv \
        --env DOCKER_HOST=unix:///var/run/docker.sock \
        --env "WAIOTECH_APP_DIR=$DEPLOY_DIR" \
        "waiotech-deployer:$GITMAN_VERSION" \
        "$GITMAN_VERSION"
      echo "version=$GITMAN_VERSION" >> "$GITMAN_SUMMARY"
