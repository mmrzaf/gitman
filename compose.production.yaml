# Public HTTPS: docker compose -f compose.yaml -f compose.production.yaml up --build -d
services:
  web:
    environment:
      GITMAN_PUBLIC_URL: https://${GITMAN_DOMAIN:?Set the public domain}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GITMAN_DOMAIN: ${GITMAN_DOMAIN:?Set the public domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
