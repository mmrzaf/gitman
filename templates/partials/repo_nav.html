{{define "repo_nav"}}
{{if .RepoNav}}
{{$owner := .RepoNav.Owner.Username}} {{$repo := .RepoNav.Repository.Name}} {{$active := .RepoNav.Active}}
<nav class="repo-nav" aria-label="Repository navigation">
  <div class="repo-nav-links">
    <a {{if eq $active "files"}}class="active" aria-current="page"{{end}} href="/{{$owner}}/{{$repo}}/tree{{if .RepoNav.CurrentRef}}?ref={{urlquery .RepoNav.CurrentRef}}{{end}}">Files</a>
    <a {{if eq $active "commits"}}class="active" aria-current="page"{{end}} href="/{{$owner}}/{{$repo}}/commits{{if .RepoNav.CurrentRef}}?ref={{urlquery .RepoNav.CurrentRef}}{{end}}">Commits</a>
    {{if .RepoNav.CanViewCI}}<a {{if eq $active "ci"}}class="active" aria-current="page"{{end}} href="/{{$owner}}/{{$repo}}/ci">CI</a>{{end}}
    {{if .RepoNav.IsOwner}}<a {{if eq $active "settings"}}class="active" aria-current="page"{{end}} href="/{{$owner}}/{{$repo}}/settings">Settings</a>{{end}}
  </div>
  {{if ne $active "settings"}}<button class="repo-file-finder-link js-only" type="button" data-file-finder-open>Go to file <kbd>t</kbd></button>{{end}}
</nav>
{{end}}
{{end}}
