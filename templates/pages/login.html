{{define "content"}}
<section class="auth-page">
  <h1>Login</h1>
  {{template "flash" .}}
  <form method="POST" action="/login" class="settings-form">
    <label><span>Username</span><input type="text" name="username" value="{{.Username}}" required autocomplete="username" autofocus></label>
    <label><span>Password</span><input type="password" name="password" required autocomplete="current-password"></label>
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button type="submit">Login</button>
  </form>
  {{if .Config.AllowRegister}}<p class="auth-switch">No account? <a href="/register">Register</a>.</p>{{end}}
</section>
{{end}}
