{{define "content"}}
<div class="page-heading"><h1>SSH keys</h1><p>Keys used for Git over SSH.</p></div>
{{template "flash" .}}
<div class="split-layout">
  <section class="primary-column">
    {{if .Keys}}
    <div class="resource-list">{{range .Keys}}<div class="resource-row"><div><strong>{{.Name}}</strong>{{if .Fingerprint}}<div class="meta-line mono">{{.Fingerprint}}</div>{{end}}<div class="meta-line">Added {{.CreatedAt.Format "Jan 02, 2006"}}</div></div><form method="POST" action="/keys/{{.ID}}/delete" data-confirm="Delete SSH key {{.Name}}?"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><button class="danger-link" type="submit">Delete</button></form></div>{{end}}</div>
    {{else}}<p class="empty-line">No SSH keys.</p>{{end}}
  </section>
  <aside class="side-form">
    <h2>Add SSH key</h2>
    <form method="POST" action="/keys" class="settings-form">
      <label><span>Name</span><input type="text" name="name" required maxlength="100" placeholder="Work laptop"></label>
      <label><span>Public key</span><textarea name="public_key" rows="6" required maxlength="16384" placeholder="ssh-ed25519 AAAA…"></textarea></label>
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button type="submit">Add key</button>
    </form>
  </aside>
</div>
{{end}}
