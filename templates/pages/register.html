{{define "content"}}
<section class="auth-page">
  <h1>Register</h1>
  {{template "flash" .}}
  <form method="POST" action="/register" class="settings-form">
    <label><span>Username</span><input type="text" name="username" value="{{.Username}}" required autocomplete="username" autofocus></label>
    <label><span>Password</span><input type="password" name="password" required autocomplete="new-password"></label>
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button type="submit">Create account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="/login">Login</a>.</p>
</section>
{{end}}
