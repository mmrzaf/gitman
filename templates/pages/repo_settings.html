{{define "content"}}
<div class="page-header section-heading">
  <h2>Settings</h2>
  <p class="muted">Repository visibility, description, and destructive actions.</p>
</div>
{{template "flash" .}}

<div class="content-grid">
  <section class="form-card">
    <h3>General</h3>
    <form method="POST" action="/{{.Data.Owner.Username}}/{{.Data.Repository.Name}}/settings" class="form-stack">
      <label class="field">
        <span>Name</span>
        <input type="text" value="{{.Data.Repository.Name}}" readonly />
      </label>
      <label class="field">
        <span>Description</span>
        <textarea name="description" rows="4" maxlength="500">{{.Data.Repository.Description}}</textarea>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" name="is_private" {{if .Data.Repository.IsPrivate}}checked{{end}} />
        Private repository
      </label>
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
      <button type="submit">Save settings</button>
    </form>
  </section>

  <aside class="form-card side-panel danger-zone">
    <h3>Delete repository</h3>
    <p class="muted">Permanently removes the repository, CI history, logs, artifacts and cache.</p>
    <form method="POST" action="/repos/{{.Data.Repository.ID}}/delete" data-confirm="Delete repository {{.Data.Repository.Name}}? This cannot be undone.">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
      <button type="submit" class="danger">Delete repository</button>
    </form>
  </aside>
</div>
{{end}}
