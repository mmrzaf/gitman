{{define "content"}}
<div class="page-heading"><h1>Settings</h1></div>
{{template "repo_settings_nav" .}}
{{template "flash" .}}
<section class="settings-section">
  <div class="section-copy"><h2>General</h2><p>Repository description and visibility.</p></div>
  <div class="section-body">
    <form method="POST" action="/{{.Owner.Username}}/{{.Repository.Name}}/settings" class="settings-form narrow-form">
      <div class="static-field"><span>Name</span><code>{{.Repository.Name}}</code></div>
      <label><span>Description</span><textarea name="description" rows="4" maxlength="500">{{.Repository.Description}}</textarea></label>
      <label class="check"><input type="checkbox" name="is_private" {{if .Repository.IsPrivate}}checked{{end}}> Private repository</label>
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><div><button type="submit">Save changes</button></div>
    </form>
  </div>
</section>
<section class="settings-section danger-section">
  <div class="section-copy"><h2>Delete repository</h2><p>Permanently removes Git data, CI history, logs, artifacts, and cache.</p></div>
  <div class="section-body"><form method="POST" action="/repos/{{.Repository.ID}}/delete" data-confirm="Delete repository {{.Repository.Name}}? This cannot be undone."><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button type="submit" class="danger">Delete repository</button></form></div>
</section>
{{end}}
