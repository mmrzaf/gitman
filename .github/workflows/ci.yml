name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: 'v2.13.2'
  GOVULNCHECK_VERSION: 'v1.6.0'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      GITMAN_INTEGRATION_ARTIFACTS: ${{ github.workspace }}/.data/integration-artifacts
      GITMAN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gitman_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Verify source
        run: scripts/verify.sh
      - name: Build and check the image
        run: |
          docker build --build-arg VERSION=ci -t gitman:ci .
          test "$(docker run --rm gitman:ci gitman version)" = 'gitman ci'
          cp .env.example .env
          GITMAN_DATABASE_PASSWORD=ci GITMAN_DATA_DIR=/tmp/gitman-compose docker compose config --quiet
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          docker pull alpine:3.20
          npm ci --prefix scripts
          scripts/node_modules/.bin/playwright install --with-deps chromium
      - name: Backup and restore round trip
        run: scripts/backup-test.sh
      - name: Real Docker integration
        run: scripts/e2e.sh
      - name: Browser, accessibility and responsive checks
        run: scripts/browser.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: integration-evidence
          path: .data/integration-artifacts
          retention-days: 7
