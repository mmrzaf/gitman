name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish, for example v1.0.0-beta.17'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: gitman
  GOLANGCI_LINT_VERSION: 'v2.13.2'
  GOVULNCHECK_VERSION: 'v1.6.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_IMAGE: golang:1.27-bookworm
  RUNTIME_IMAGE: debian:bookworm-slim
  DOCKER_CLI_IMAGE: docker:29-cli
  DEBIAN_MIRROR: http://deb.debian.org/debian
  DEBIAN_SECURITY_MIRROR: http://security.debian.org/debian-security
  GOPROXY: https://proxy.golang.org,direct

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      clean_version: ${{ steps.meta.outputs.clean_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Validate release version
        id: meta
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must look like v1.2.3 or v1.2.3-beta.12: $version" >&2
            exit 1
          fi

          clean_version="${version#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "version=$version"
            echo "clean_version=$clean_version"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: release-metadata
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      GITMAN_INTEGRATION_ARTIFACTS: ${{ github.workspace }}/.data/integration-artifacts
      GITMAN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gitman_test?sslmode=disable
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify source
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: scripts/verify.sh

      - name: Docker smoke build
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg GO_IMAGE="$GO_IMAGE" \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            --build-arg DOCKER_CLI_IMAGE="$DOCKER_CLI_IMAGE" \
            --build-arg DEBIAN_MIRROR="$DEBIAN_MIRROR" \
            --build-arg DEBIAN_SECURITY_MIRROR="$DEBIAN_SECURITY_MIRROR" \
            --build-arg GOPROXY="$GOPROXY" \
            --build-arg VERSION="$VERSION" \
            -t gitman:verify .
          test "$(docker run --rm gitman:verify gitman version)" = "gitman $VERSION"
          cp .env.example .env
          GITMAN_DATABASE_PASSWORD=ci GITMAN_DATA_DIR=/tmp/gitman-compose docker compose config --quiet

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          docker pull alpine:3.20
          npm ci --prefix scripts
          scripts/node_modules/.bin/playwright install --with-deps chromium
      - name: Backup and restore round trip
        run: scripts/backup-test.sh
      - name: Real Docker integration
        run: scripts/e2e.sh
      - name: Browser, accessibility and responsive checks
        run: scripts/browser.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: integration-evidence
          path: .data/integration-artifacts
          retention-days: 7

  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [release-metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/${APP_NAME}_${GOOS}_${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" ./cmd/gitman

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  source-archive:
    name: Build source archive
    runs-on: ubuntu-latest
    needs: [release-metadata, verify]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Build the source archive of the tag
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          make release-source
          tar -tzf "dist/gitman-${VERSION#v}.tar.gz" | sort

      - name: Upload source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-archive
          path: dist/*.tar.gz
          if-no-files-found: error

  docker-image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [release-metadata, verify]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-metadata.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-metadata.outputs.version }},enable=${{ needs.release-metadata.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.release-metadata.outputs.prerelease == 'false' }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_IMAGE=${{ env.GO_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            DOCKER_CLI_IMAGE=${{ env.DOCKER_CLI_IMAGE }}
            DEBIAN_MIRROR=${{ env.DEBIAN_MIRROR }}
            DEBIAN_SECURITY_MIRROR=${{ env.DEBIAN_SECURITY_MIRROR }}
            GOPROXY=${{ env.GOPROXY }}
            VERSION=${{ needs.release-metadata.outputs.version }}

  docker-archive:
    name: Build Docker archive
    runs-on: ubuntu-latest
    needs: [release-metadata, verify]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Build linux/amd64 Docker tarball
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          CLEAN_VERSION: ${{ needs.release-metadata.outputs.clean_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          image="gitman:${CLEAN_VERSION}"
          docker build --platform linux/amd64 \
            --build-arg GO_IMAGE="$GO_IMAGE" \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            --build-arg DOCKER_CLI_IMAGE="$DOCKER_CLI_IMAGE" \
            --build-arg DEBIAN_MIRROR="$DEBIAN_MIRROR" \
            --build-arg DEBIAN_SECURITY_MIRROR="$DEBIAN_SECURITY_MIRROR" \
            --build-arg GOPROXY="$GOPROXY" \
            --build-arg VERSION="$VERSION" \
            -t "$image" .
          test "$(docker run --rm "$image" gitman version)" = "gitman $VERSION"
          docker save "$image" | gzip -9 >"dist/gitman-docker-image-linux-amd64-${CLEAN_VERSION}.tar.gz"

      - name: Upload Docker archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-archive
          path: dist/*
          if-no-files-found: error

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [release-metadata, build-binaries, source-archive, docker-image, docker-archive]
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}

      - name: Take the release notes from CHANGELOG.md
        shell: bash
        env:
          CLEAN_VERSION: ${{ needs.release-metadata.outputs.clean_version }}
        run: |
          set -euo pipefail
          awk -v heading="## [${CLEAN_VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for ${CLEAN_VERSION}" >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -- * | sort -k2 > SHA256SUMS
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.release-metadata.outputs.version }}
          name: Gitman ${{ needs.release-metadata.outputs.version }}
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          body_path: ${{ runner.temp }}/notes.md
          files: release/*
