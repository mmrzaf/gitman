name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: gitman
  GOLANGCI_LINT_VERSION: 'v2.15.0'
  GOVULNCHECK_VERSION: 'v1.6.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_IMAGE: golang:1.27.4-alpine
  RUNTIME_IMAGE: alpine:3.24
  DOCKER_CLI_IMAGE: docker:29-cli
  APK_MIRROR: https://dl-cdn.alpinelinux.org/alpine
  GOPROXY: https://proxy.golang.org,direct

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      clean_version: ${{ steps.meta.outputs.clean_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Validate release version
        id: meta
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must look like v1.2.3 or v1.2.3-rc.1: $version" >&2
            exit 1
          fi

          clean_version="${version#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "version=$version"
            echo "clean_version=$clean_version"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"

      # Validate the actual tagged commit before starting expensive release jobs.
      - name: Checkout release tag for metadata validation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.meta.outputs.version }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate release metadata and offline publication checks
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/check-release-metadata.mjs "$VERSION"
          scripts/release-artifacts-test.sh
          scripts/promote-floating-tags-test.sh

  verify-source:
    name: Verify source
    runs-on: ubuntu-latest
    needs: release-metadata
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      GITMAN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gitman_test?sslmode=disable
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install required shell lint tool
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Verify source
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          GITMAN_REQUIRE_SHELLCHECK: '1'
        run: scripts/verify.sh

  verify-integration:
    name: Verify integration
    runs-on: ubuntu-latest
    needs: release-metadata
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      GITMAN_INTEGRATION_ARTIFACTS: ${{ github.workspace }}/.data/integration-artifacts
      GITMAN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gitman_test?sslmode=disable
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker smoke build
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg GO_IMAGE="$GO_IMAGE" \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            --build-arg DOCKER_CLI_IMAGE="$DOCKER_CLI_IMAGE" \
            --build-arg APK_MIRROR="$APK_MIRROR" \
            --build-arg GOPROXY="$GOPROXY" \
            --build-arg VERSION="$VERSION" \
            -t gitman:verify .
          test "$(docker run --rm gitman:verify gitman version)" = "gitman $VERSION"
          cp .env.example .env
          GITMAN_DATABASE_PASSWORD=ci GITMAN_DATA_DIR=/tmp/gitman-compose docker compose config --quiet

      - name: Integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          docker pull alpine:3.20
      - name: Fresh installation and authenticated Git transport
        run: scripts/clean-install-test.sh
      - name: Backup and restore round trip
        run: scripts/backup-test.sh
      - name: Real Docker integration
        run: scripts/e2e.sh
      - name: Two workers sharing one Docker host
        run: scripts/multiworker.sh
      - name: Isolated production Compose installation
        run: scripts/compose-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-integration-evidence
          path: .data/integration-artifacts
          retention-days: 7

  verify-browser:
    name: Verify browser
    runs-on: ubuntu-latest
    needs: release-metadata
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      GITMAN_INTEGRATION_ARTIFACTS: ${{ github.workspace }}/.data/integration-artifacts
      GITMAN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gitman_test?sslmode=disable
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          docker pull alpine:3.20
          npm ci --prefix scripts
          scripts/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser, accessibility and responsive checks
        run: scripts/browser.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-browser-evidence
          path: .data/integration-artifacts
          retention-days: 7

  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [release-metadata, verify-source, verify-integration, verify-browser]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/${APP_NAME}_${GOOS}_${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" ./cmd/gitman

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  source-archive:
    name: Build source archive
    runs-on: ubuntu-latest
    needs: [release-metadata, verify-source, verify-integration, verify-browser]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Build the source archive of the tag
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          make release-source
          tar -tzf "dist/gitman-${VERSION#v}.tar.gz" | sort

      - name: Upload source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-source-archive
          path: dist/*.tar.gz
          if-no-files-found: error

  docker-image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [release-metadata, stage-release]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-metadata.outputs.version }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_IMAGE=${{ env.GO_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            DOCKER_CLI_IMAGE=${{ env.DOCKER_CLI_IMAGE }}
            APK_MIRROR=${{ env.APK_MIRROR }}
            GOPROXY=${{ env.GOPROXY }}
            VERSION=${{ needs.release-metadata.outputs.version }}

      - name: Verify published versioned image
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.clean_version }}
        run: |
          set -euo pipefail
          ref="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools inspect "$ref" | tee "$RUNNER_TEMP/manifest.txt"
          grep -q 'linux/amd64' "$RUNNER_TEMP/manifest.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP/manifest.txt"

  docker-archive:
    name: Build Docker archive
    runs-on: ubuntu-latest
    needs: [release-metadata, verify-source, verify-integration, verify-browser]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
          fetch-depth: 0

      - name: Build linux/amd64 Docker tarball
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          CLEAN_VERSION: ${{ needs.release-metadata.outputs.clean_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          image="gitman:${CLEAN_VERSION}"
          docker build --platform linux/amd64 \
            --build-arg GO_IMAGE="$GO_IMAGE" \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            --build-arg DOCKER_CLI_IMAGE="$DOCKER_CLI_IMAGE" \
            --build-arg APK_MIRROR="$APK_MIRROR" \
            --build-arg GOPROXY="$GOPROXY" \
            --build-arg VERSION="$VERSION" \
            -t "$image" .
          test "$(docker run --rm "$image" gitman version)" = "gitman $VERSION"
          docker save "$image" | gzip -9 >"dist/gitman-docker-image-linux-amd64-${CLEAN_VERSION}.tar.gz"

      - name: Upload Docker archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-docker-archive
          path: dist/*
          if-no-files-found: error

  stage-release:
    name: Validate artifacts and stage draft release
    runs-on: ubuntu-latest
    needs: [release-metadata, build-binaries, source-archive, docker-archive]
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
      - name: Extract release notes
        env:
          CLEAN_VERSION: ${{ needs.release-metadata.outputs.clean_version }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v heading="## [${CLEAN_VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for ${CLEAN_VERSION}" >&2
            exit 1
          fi
      - name: Download all distributables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Check all release assets and offline Docker image
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          CLEAN_VERSION: ${{ needs.release-metadata.outputs.clean_version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -- * | sort -k2 > SHA256SUMS)
          scripts/verify-release-artifacts.sh "$VERSION" release
          docker load -i "release/gitman-docker-image-linux-amd64-${CLEAN_VERSION}.tar.gz"
          test "$(docker run --rm "gitman:${CLEAN_VERSION}" gitman version)" = "gitman ${VERSION}"
      - name: Refuse to overwrite a published release on rerun
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo "${VERSION} is already published; do not restage it as a draft" >&2
              exit 1
            fi
          fi
      - name: Stage checked assets in a draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.release-metadata.outputs.version }}
          name: Gitman ${{ needs.release-metadata.outputs.version }}
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          draft: true
          body_path: ${{ runner.temp }}/notes.md
          files: release/*

  create-release:
    name: Publish verified release
    runs-on: ubuntu-latest
    needs: [release-metadata, stage-release, docker-image]
    permissions:
      contents: write
    steps:
      - name: Publish the staged GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.release-metadata.outputs.version }}
          name: Gitman ${{ needs.release-metadata.outputs.version }}
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          draft: false

  promote-tags:
    name: Promote stable floating Docker tags
    runs-on: ubuntu-latest
    concurrency:
      group: gitman-ghcr-floating-tags
      cancel-in-progress: false
    if: needs.release-metadata.outputs.prerelease == 'false'
    needs: [release-metadata, create-release]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-metadata.outputs.version }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote existing multi-arch manifest without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: scripts/promote-floating-tags.sh "$VERSION" "${REGISTRY}/${IMAGE_NAME}"
